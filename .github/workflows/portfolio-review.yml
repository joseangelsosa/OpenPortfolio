name: Portfolio review

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        type: choice
        default: review
        options:
          - review
          - check-real-quotes
      provider:
        description: Market-data provider
        required: true
        type: choice
        default: fake
        options:
          - fake
          - yfinance
      dry_run:
        description: Preview without notifications or state changes
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: portfolio-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Run test suite
        run: python -m pytest

      - name: Restore alert delivery state
        if: inputs.operation == 'review'
        uses: actions/cache/restore@v4
        with:
          path: state/alert_state.json
          key: alert-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alert-state-${{ runner.os }}-

      - name: Validate operational safety
        if: inputs.operation == 'review' && inputs.provider == 'yfinance' && !inputs.dry_run
        run: |
          echo 'yfinance is restricted to dry-run in this increment.' >&2
          exit 2

      - name: Run portfolio review
        id: operational-review
        if: inputs.operation == 'review'
        shell: bash
        run: |
          portfolio='examples/demo_portfolio.yaml'
          if [[ '${{ inputs.provider }}' == 'yfinance' ]]; then
            portfolio='examples/operational_review.yaml'
          fi
          arguments=(review --portfolio "$portfolio" --provider '${{ inputs.provider }}' --notifier console)
          if [[ '${{ inputs.dry_run }}' == 'true' ]]; then
            arguments+=(--dry-run)
          fi
          openportfolio "${arguments[@]}"

      - name: Check real quotes with yfinance
        if: inputs.operation == 'check-real-quotes'
        run: >-
          openportfolio
          --check-quotes
          --portfolio examples/operational_review.yaml
          --provider yfinance

      - name: Save updated alert delivery state
        if: always() && inputs.operation == 'review' && steps.operational-review.outcome == 'success' && !inputs.dry_run && hashFiles('state/alert_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state/alert_state.json
          key: alert-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
