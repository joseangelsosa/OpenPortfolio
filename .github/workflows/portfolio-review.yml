name: Portfolio review

on:
  schedule:
    - cron: "5 8,12,16,20 * * 1-5"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        type: choice
        default: fake
        options:
          - fake
          - dry-run
          - check-real-quotes
          - send-test-notification
          - review-and-notify

permissions:
  contents: read

concurrency:
  group: portfolio-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Run test suite
        run: python -m pytest

      - name: Restore alert delivery state
        if: github.event_name == 'schedule' || inputs.operation == 'fake' || inputs.operation == 'review-and-notify'
        uses: actions/cache/restore@v5
        with:
          path: state/alert_state.json
          key: alert-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alert-state-${{ runner.os }}-

      - name: Run fake portfolio review
        id: operational_review
        if: inputs.operation == 'fake'
        run: openportfolio review --portfolio examples/demo_portfolio.yaml --provider fake --notifier console

      - name: Preview fake portfolio review
        if: inputs.operation == 'dry-run'
        run: openportfolio review --portfolio examples/demo_portfolio.yaml --provider fake --notifier console --dry-run

      - name: Check real quotes with yfinance
        if: inputs.operation == 'check-real-quotes'
        run: >-
          openportfolio
          --check-quotes
          --portfolio examples/operational_review.yaml
          --provider yfinance

      - name: Send controlled test notification
        if: inputs.operation == 'send-test-notification'
        env:
          OPENPORTFOLIO_NTFY_TOPIC: ${{ secrets.OPENPORTFOLIO_NTFY_TOPIC }}
        run: openportfolio send-test-notification

      - name: Run real review and notify
        id: review_and_notify
        if: github.event_name == 'schedule' || inputs.operation == 'review-and-notify'
        env:
          OPENPORTFOLIO_NTFY_TOPIC: ${{ secrets.OPENPORTFOLIO_NTFY_TOPIC }}
        run: >-
          openportfolio review
          --portfolio examples/operational_review.yaml
          --provider yfinance
          --notifier ntfy
          --operational-notification

      - name: Save updated alert delivery state
        if: always() && (github.event_name == 'schedule' || inputs.operation == 'fake' || inputs.operation == 'review-and-notify') && hashFiles('state/alert_state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: state/alert_state.json
          key: alert-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
